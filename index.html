    <!-- Person schema — tells search engines and AI assistants who this
         site is about (name, handle, student status, profiles). Metadata
         only; nothing renders. No jobTitle by the owner's choice. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Murad Hasan Tamim",
      "alternateName": "mhtamim136",

    <!-- Theme colour — matches the dark default (useTheme updates this
         when the user toggles to light, so it never follows the OS). -->
    <meta name="theme-color" content="#0a0e13" />

    <!-- Agent discovery (Agentic Resource Discovery): lets AI agents
         find this site's catalog manifest.
         - ai-catalog points at the root copy: Lighthouse follows the
           link tag, and the root path is served from the same origin
           being audited. (The old setup pointed discovery at the LIVE
           domain via robots.txt Agentmap, where the catalog is not
           deployed yet — so the audit fetched the live 404 page
           instead of the local file and failed.)
         - ard points at the ARD v0.91 location, which newer Lighthouse
           (13.6+) checks first. Both files hold the same manifest. -->
    <link rel="ai-catalog" href="/ai-catalog.json" profile="urn:air:agent-skills" />
    <link rel="ard" href="/.well-known/ard.json" />

    <!--
      Inline theme init — runs synchronously before first paint
      so the user never sees a flash of the wrong theme.

      Dark is the default. Only an explicit 'light' choice is honoured.
      The resolved value is stored, so a first-time visitor is no longer
      "nothing stored" — the OS preference can never flip the theme
      afterwards (see useTheme.js).
    -->
    <script>
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('theme');
          t = t === 'light' ? 'light' : 'dark';
          localStorage.setItem('theme', t);
        } catch (e) {
          /* Storage unavailable (e.g. private mode) — dark still applies. */
          t = 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>

    <!-- Fonts: self-hosted via @fontsource-variable (bundled in CSS).
         No external Google Fonts request — zero render-blocking. -->

    <title>Murad Hasan Tamim | Software Developer</title>
